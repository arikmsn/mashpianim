<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משפיען אונליין — אופליין</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);
      color: #333;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 400px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #1a1a1a;
    }
    p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #833AB4, #E1306C, #F77737);
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/icon-192.png" alt="משפיען אונליין" width="80" height="80" style="border-radius:16px;margin-bottom:1.5rem;box-shadow:0 8px 24px rgba(225,48,108,0.2)">
    <h1>אין חיבור לאינטרנט</h1>
    <p>נראה שאתם לא מחוברים כרגע. בדקו את החיבור לאינטרנט ונסו שוב.</p>
    <button class="btn" onclick="location.reload()">נסו שוב</button>
  </div>
</body>
</html>
